services:
  postgres:
    image: postgres:16-alpine
    container_name: gema-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gema_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-gema_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gema_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: gema-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Strictly loopback binding: accessible ONLY to host Nginx on 127.0.0.1:3000
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URI: postgresql://${POSTGRES_USER:-gema_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gema_production}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET must be set}
      PREVIEW_SECRET: ${PREVIEW_SECRET:?PREVIEW_SECRET must be set}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://127.0.0.1:3000}
    volumes:
      # Host persistent CMS media directory bind mount
      - ${MEDIA_DIR:-/opt/gema/data/media}:/app/public/media/cms
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - gema_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  gema_network:
    driver: bridge

volumes:
  postgres_data:
